<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indulger - Full Stack Engineer | 粒子艺术展示</title>
    <link rel="icon" href="/public/logo_texture.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* 粒子容器样式升级 */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.02) 0%, transparent 70%);
        }

        #canvas-container canvas {
            display: block;
            filter: brightness(1.2) contrast(1.1);
        }

        /* 控制面板升级 */
        .controls {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            gap: 15px;
            flex-direction: column;
        }

        .control-btn {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
        }

        /* 信息面板 */
        .info-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            transform: translateY(100px);
            opacity: 0;
            animation: slideUp 1s ease 2s forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .info-panel h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ffffff, #a8edea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info-panel .title {
            font-size: 16px;
            color: #a8edea;
            margin-bottom: 15px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .info-panel .description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
        }

        /* 技术栈标签 */
        .tech-stack {
            position: fixed;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            animation: fadeInRight 1s ease 3s forwards;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateY(-50%) translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }

        .tech-tag {
            padding: 8px 12px;
            background: rgba(168, 237, 234, 0.1);
            border: 1px solid rgba(168, 237, 234, 0.3);
            border-radius: 15px;
            color: #a8edea;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .tech-tag:hover {
            background: rgba(168, 237, 234, 0.2);
            transform: translateX(-5px);
        }

        /* 加载动画 */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        .loading-text {
            font-size: 24px;
            font-weight: 300;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* 波浪效果容器 */
        #waves-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .controls {
                top: 20px;
                right: 20px;
                flex-direction: row;
                gap: 10px;
            }

            .control-btn {
                padding: 10px 15px;
                font-size: 10px;
            }

            .info-panel {
                bottom: 20px;
                left: 20px;
                right: 20px;
                max-width: none;
                padding: 20px;
            }

            .tech-stack {
                display: none;
            }

            .info-panel h1 {
                font-size: 24px;
            }
        }

        /* 粒子轨迹效果 */
        .particle-trail {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: trailFade 1s ease-out forwards;
        }

        @keyframes trailFade {
            to {
                opacity: 0;
                transform: scale(0);
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-text">Initializing Particle System...</div>
    </div>

    <div id="canvas-container"></div>
    <div id="waves-container"></div>

    <div class="controls">
        <button class="control-btn" onclick="restartAnimation()">🔄 Restart</button>
        <button class="control-btn" onclick="togglePause()">⏸️ Pause</button>
        <button class="control-btn" onclick="toggleFullscreen()">🔍 Fullscreen</button>
    </div>

    <div class="info-panel">
        <h1>Indulger</h1>
        <div class="title">Full Stack Engineer</div>
        <div class="description">
            专注于创建令人惊叹的Web体验，结合前端创新与后端架构。
            使用Three.js、WebGL等技术打造沉浸式交互体验。
        </div>
        <div class="social-links">
            <a href="https://github.com/indulgers" target="_blank" class="social-link">
                <span>🐙</span> GitHub
            </a>
            <a href="mailto:your.email@example.com" class="social-link">
                <span>📧</span> Contact
            </a>
        </div>

    </div>

    <div class="tech-stack">
        <div class="tech-tag">Three.js</div>
        <div class="tech-tag">WebGL</div>
        <div class="tech-tag">React</div>
        <div class="tech-tag">Node.js</div>
        <div class="tech-tag">TypeScript</div>
        <div class="tech-tag">Python</div>
        <div class="tech-tag">Docker</div>
        <div class="tech-tag">AWS</div>
    </div>

    <!-- 改为使用 Vite 的入口点 -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
